# Letterpress for Hermes. name is the registry key; label is the display name.
manifest_version: 2
name: letterpress
label: Letterpress
version: 0.1.1
description: "A notebook for your own sources inside Hermes Desktop. Add files, web pages and notes, ask questions and get answers that cite the exact passage, then make a slide deck, a one-pager, a graphic or an audio brief in one of five studio brands or your own. Runs on your own Hermes model."
author: Damon Gardenhire
license: MIT
kind: standalone
requires_hermes: ">=0.22.6"
tags: [documents, brand, design, desktop]
provides_tools: []
provides_hooks: []
python_dependencies:
  - "pypdf>=6.21.4,<7"
  - "python-docx>=1.1,<2"
  - "python-pptx>=1.0,<2"
  - "reportlab>=4.0,<6"
  - "Pillow>=10,<14"
