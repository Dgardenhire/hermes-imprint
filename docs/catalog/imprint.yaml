name: imprint
title: Imprint
repo: https://github.com/Dgardenhire/hermes-imprint
sha: SHA_PLACEHOLDER
description: "Drop in your PDFs, Word files and text, and Imprint turns them into a finished deck, one-pager, graphic or audio brief in your own brand. Pick from three deck designs (Editorial, Data board, Statement), mix slides between them, and revise any slide by asking in plain words. Ask questions of your sources and get answers that cite the paragraph. Numbers and quotes are checked against your sources before export, and a Source notes PDF sets each one beside the sentence it came from. The check covers numbers and quotes, not claims or framing, so read the headlines yourself. Five built-in brands, or make your own. Independent community plugin, not made or endorsed by Nous Research. Disclosure: source text (secrets redacted by Hermes), questions, briefs and pictures of draft slides go to the user's own Hermes model (auxiliary task 'Imprint writing'); audio scripts to the user's Hermes text-to-speech provider (default Edge, Microsoft's online voice service). Web reads go only to addresses the user enters, via the user's web_extract tool or Hermes's SSRF-safe client (public addresses only, every redirect checked, size and time capped). Starts a headless Google Chrome, Chromium, Microsoft Edge or Brave as a child process with a throwaway profile (from IMPRINT_BROWSER, else the usual install folders on macOS and Windows, else PATH); it draws designs and their PDF and image exports with all network requests blocked and, on macOS and Linux, views a website the user builds a brand from (up to four pages, read only, robots.txt respected) through a checking proxy on 127.0.0.1 that refuses non-public addresses. On macOS runs sips for one-pager previews. Reads only files the user picks; writes only to $HERMES_HOME/plugin-data/imprint/ (or IMPRINT_DATA_DIR, if set), scratch folders it deletes, and paths picked in the save dialog. Background threads run only after a button press. No stored credentials, self-updates or telemetry. Registers no tools, hooks or middleware (only an auxiliary model task, a Desktop page and a dashboard API); calls the user's tools text_to_speech and web_extract by fixed name, and image_generate only through an API flag the shipped page never sends. Python dependencies: pypdf, python-docx, python-pptx, reportlab, Pillow. Bundles OFL fonts, no compiled code. Full detail in the README."
